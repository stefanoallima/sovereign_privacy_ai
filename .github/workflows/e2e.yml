# E2E test suite — runs Playwright against the Tauri debug binary on every push/PR.
# Estimated CI time: build ~12 min + tests ~8 min = ~20 min total.
name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e-windows:
    name: E2E Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: D:\ct
      CMAKE: "C:\\Program Files\\CMake\\bin\\cmake.exe"
      AILOCALMIND_TEST_MODE: "1"
      AILOCALMIND_MOCK_CLOUD: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install
        working-directory: apps/desktop

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/desktop

      # The Tauri build needs libclang (llama-cpp-sys bindgen) and the ONNX Runtime
      # DLL that tauri.windows.conf.json bundles as a resource — the release
      # workflow sets both up, but this one didn't, so the build failed at the
      # resource check before compiling any Rust.
      - name: Install LLVM (libclang for bindgen)
        run: |
          choco install llvm -y
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Bundle ONNX Runtime (required by tauri bundle resources)
        run: |
          New-Item -ItemType Directory -Force -Path "apps/desktop/src-tauri/onnxruntime"
          Invoke-WebRequest -Uri "https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-win-x64-1.20.1.zip" -OutFile "$env:TEMP\ort.zip"
          Expand-Archive -Path "$env:TEMP\ort.zip" -DestinationPath "$env:TEMP\ort"
          Copy-Item "$env:TEMP\ort\onnxruntime-win-x64-1.20.1\lib\onnxruntime.dll" "apps/desktop/src-tauri/onnxruntime/"
          Copy-Item "$env:TEMP\ort\onnxruntime-win-x64-1.20.1\lib\onnxruntime_providers_shared.dll" "apps/desktop/src-tauri/onnxruntime/"

      - name: Build Tauri (debug)
        run: pnpm tauri build --debug
        working-directory: apps/desktop

      - name: Run E2E tests
        run: pnpm test:e2e
        working-directory: apps/desktop
        env:
          SKIP_TAURI_BUILD: "1"   # binary already built above
          TAURI_BIN: D:\ct\debug\ailocalmind.exe

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            apps/desktop/e2e/reports/
            apps/desktop/test-results/
